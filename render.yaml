# Render Blueprint for ReachInbox (optional IaC — mirrors DEPLOYMENT.md).
# Creates: API web service + background worker + PostgreSQL + Key Value.
# Secrets are never stored here: `sync: false` prompts in the dashboard,
# `generateValue: true` creates SESSION_SECRET automatically.
# Local Docker development (docker-compose.yml) is unaffected by this file.

services:
  - type: web
    name: reachinbox-api
    runtime: node
    rootDir: backend
    buildCommand: npm install && npm run build
    # Runs AFTER build, BEFORE start on every deploy: safe, idempotent.
    preDeployCommand: npx prisma migrate deploy
    startCommand: npm start
    healthCheckPath: /api/health
    maxShutdownDelaySeconds: 30
    envVars:
      - key: NODE_ENV
        value: production
      # Render injects PORT automatically; the app listens on process.env.PORT.
      - key: FRONTEND_URL
        value: https://reachinbox-frontend.vercel.app # TODO: your Vercel domain
      - key: DATABASE_URL
        fromDatabase:
          name: reachinbox-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: reachinbox-redis
          type: keyvalue
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALLBACK_URL
        value: https://reachinbox-frontend.vercel.app/api/auth/google/callback # TODO: via Vercel proxy
      - key: ETHEREAL_HOST
        value: smtp.ethereal.email
      - key: ETHEREAL_PORT
        value: 587
      - key: ETHEREAL_USER
        sync: false
      - key: ETHEREAL_PASSWORD
        sync: false
      - key: ETHEREAL_FROM
        value: ReachInbox <no-reply@ethereal.email>
      - key: ELASTICSEARCH_URL
        sync: false # External/managed endpoint
      - key: ELASTICSEARCH_INDEX
        value: reachinbox-emails
      - key: SLACK_CLIENT_ID
        sync: false
      - key: SLACK_CLIENT_SECRET
        sync: false
      - key: SLACK_REDIRECT_URI
        value: https://reachinbox-frontend.vercel.app/api/slack/callback # TODO: via Vercel proxy
      - key: BULL_BOARD_ADMIN_EMAIL
        sync: false # Unset/empty = Bull Board disabled (safe default)

  - type: worker
    name: reachinbox-worker
    runtime: node
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm run worker
    maxShutdownDelaySeconds: 60 # Let in-flight SMTP sends finish on SIGTERM
    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        value: https://reachinbox-frontend.vercel.app # TODO: your Vercel domain
      - key: DATABASE_URL
        fromDatabase:
          name: reachinbox-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: reachinbox-redis
          type: keyvalue
          property: connectionString
      # No SESSION_SECRET: the worker never signs cookies (API-only concern).
      - key: ETHEREAL_HOST
        value: smtp.ethereal.email
      - key: ETHEREAL_PORT
        value: 587
      - key: ETHEREAL_USER
        sync: false
      - key: ETHEREAL_PASSWORD
        sync: false
      - key: ETHEREAL_FROM
        value: ReachInbox <no-reply@ethereal.email>
      - key: WORKER_CONCURRENCY
        value: 5
      - key: MAX_ATTEMPTS
        value: 3
      - key: MIN_SEND_DELAY_MS
        value: 2000
      - key: ELASTICSEARCH_URL
        sync: false
      - key: ELASTICSEARCH_INDEX
        value: reachinbox-emails
      - key: SLACK_CLIENT_ID
        sync: false
      - key: SLACK_CLIENT_SECRET
        sync: false

  - type: keyvalue
    name: reachinbox-redis
    # BullMQ jobs MUST NOT be evicted: allkeys-lru would silently drop
    # delayed emails. noeviction + journal-snapshot keeps the queue durable.
    maxmemoryPolicy: noeviction
    persistenceMode: journal-snapshot
    ipAllowList: [] # Internal-only; API + worker connect over Render's network

databases:
  - name: reachinbox-db
    databaseName: reachinbox
    ipAllowList: [] # Internal-only
